name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.1.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from input
        id: get_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a pre-release (alpha or beta)
          # Match versions like 1.2.3-alpha, 1.2.3-alpha.1, 1.2.3-beta, 1.2.3-beta.2
          if [[ "$VERSION" =~ -(alpha|beta)($|\.) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release version: $VERSION"
          fi

      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse ${{ steps.get_version.outputs.tag }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} does not exist"
          fi

      - name: Create Git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Release ${{ steps.get_version.outputs.tag }}" || echo "No changes to commit"
          git tag ${{ steps.get_version.outputs.tag }}
          git push origin ${{ steps.get_version.outputs.tag }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Extract changelog for this version from CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # Find the section for this version
            # Match pattern like "## [1.1.3] - 2025-11-22"
            awk -v ver="$VERSION" '
              BEGIN { found=0; print_section=0 }
              /^## \[/ {
                if (print_section) exit
                if ($0 ~ "\\[" ver "\\]") {
                  found=1
                  print_section=1
                  next
                }
              }
              print_section && /^## \[/ { exit }
              print_section { print }
              END {
                if (!found) {
                  print "## What'\''s Changed"
                  print ""
                  print "* Release version " ver
                }
              }
            ' CHANGELOG.md > RELEASE_NOTES.md
          else
            # Fallback to git log if CHANGELOG.md doesn't exist
            echo "## What's Changed" > RELEASE_NOTES.md
            git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s (%h)" >> RELEASE_NOTES.md || echo "* Initial release" >> RELEASE_NOTES.md
          fi

          # Show what we extracted for debugging
          echo "=== Generated Release Notes ==="
          cat RELEASE_NOTES.md
          echo "==============================="

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: MrRSS ${{ steps.get_version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.get_version.outputs.is_prerelease == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  package-skills:
    name: Package Skills
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Validate generated skill API reference
        run: |
          python skills/mrrss-assistant/scripts/generate_api_reference.py docs/SERVER_MODE/swagger.json skills/mrrss-assistant/references/api.md
          git diff --exit-code skills/mrrss-assistant/references/api.md

      - name: Package MrRSS skills
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          mkdir -p build/skills
          cd skills
          zip -r "../build/skills/MrRSS-${VERSION}-skills.zip" mrrss-assistant
          cd ..
          unzip -t "build/skills/MrRSS-${VERSION}-skills.zip"

      - name: Upload Skills Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: build/skills/MrRSS-${{ needs.create-release.outputs.version }}-skills.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-client:
    name: Build macOS Universal Client
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build SwiftUI application bundle
        run: |
          chmod +x frontend/build-app.sh
          frontend/build-app.sh "${{ needs.create-release.outputs.version }}"

      - name: Upload SwiftUI macOS release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: frontend/dist/MrRSS-${{ needs.create-release.outputs.version }}-macos-swiftui-universal.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
