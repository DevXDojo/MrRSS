name: Test

on:
  push:
    branches: [ main, feature/macos-client ]
  pull_request:
    branches: [ main, develop, feature/macos-client ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...
        continue-on-error: true

      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test -v -timeout=5m -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: backend

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify MrRSS skill metadata
        run: |
          test -f skills/mrrss-assistant/SKILL.md
          test -f skills/mrrss-assistant/agents/openai.yaml
          grep -q '^name: mrrss-assistant$' skills/mrrss-assistant/SKILL.md
          grep -q '^description: ' skills/mrrss-assistant/SKILL.md
          grep -q 'Use $mrrss-assistant' skills/mrrss-assistant/agents/openai.yaml

      - name: Verify generated skill API reference
        run: |
          python skills/mrrss-assistant/scripts/generate_api_reference.py docs/SERVER_MODE/swagger.json skills/mrrss-assistant/references/api.md
          git diff --exit-code skills/mrrss-assistant/references/api.md

  test-macos-client:
    name: Test macOS Client
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run Swift tests
        working-directory: ./frontend
        run: swift test

      - name: Build release executable
        working-directory: ./frontend
        run: swift build -c release

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Verify Go code compiles
        env:
          CGO_ENABLED: 1
        run: go build -v ./...
