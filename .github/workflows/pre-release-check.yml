name: Pre-release Check

on:
  workflow_dispatch:

jobs:
  build-check:
    name: Build macOS Client Bundle
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Run backend tests
        env:
          CGO_ENABLED: 1
        run: go test -timeout=5m ./internal/...

      - name: Run macOS client tests
        working-directory: ./frontend
        run: swift test

      - name: Build the application bundle
        run: |
          chmod +x frontend/build-app.sh
          frontend/build-app.sh "pre-release-check"

      - name: Verify bundle contents
        run: |
          test -x frontend/dist/MrRSS-SwiftUI.app/Contents/MacOS/MrRSS-SwiftUI
          test -x frontend/dist/MrRSS-SwiftUI.app/Contents/Resources/mrrss-server
          test -f frontend/dist/MrRSS-SwiftUI.app/Contents/Info.plist
